name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hub:
    name: Hub (lint + build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # woclaw is an npm workspace (root package.json); hub/package-lock.json
          # is the legacy 4-06 lock (woclaw-hub@0.3.0) and cache hits on it cause
          # `Cannot find module 'vitest/config'` failures in CI (see docs/ci-failures.md
          # 06-11 09:03 entry). Point cache at the authoritative root lock so
          # Setup-Node restores the correct dependency tree.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace=hub

      - name: TypeScript check
        working-directory: hub
        run: npx tsc --noEmit

      - name: Build
        working-directory: hub
        run: npm run build

      - name: Test
        working-directory: hub
        run: npm test

  # plugin-lint disabled: persistent npm install failure in GitHub Actions ubuntu-latest
  # tracked in https://github.com/XingP14/woclaw/issues
  # Local verification: npx tsc --noEmit && npm run build work correctly
