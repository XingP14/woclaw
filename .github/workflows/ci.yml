name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hub
            path: hub
            install: npm ci
            verify: npx tsc --noEmit && npm run build && npm test && npm pack --dry-run
          - name: OpenClaw plugin
            path: plugin
            install: npm ci
            verify: npx tsc --noEmit --project tsconfig.build.json && npm run build && npm test && npm pack --dry-run
          - name: MCP bridge
            path: mcp-bridge
            install: npm ci
            verify: npm run build && npm pack --dry-run
          - name: Hook package
            path: packages/woclaw-hooks
            install: ''
            verify: npm pack --dry-run
          - name: Codex package
            path: packages/codex-woclaw
            install: ''
            verify: npm pack --dry-run --ignore-scripts
          - name: OpenCode package
            path: packages/opencode-woclaw-plugin
            install: ''
            verify: npm pack --dry-run
          - name: VS Code extension
            path: packages/woclaw-vscode
            install: npm ci
            verify: npm run compile && npm test && npm pack --dry-run

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            hub/package-lock.json
            plugin/package-lock.json
            mcp-bridge/package-lock.json
            packages/woclaw-vscode/package-lock.json

      - name: Install dependencies
        if: matrix.install != ''
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.install }}

      - name: Verify package
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.verify }}

  schema-drift:
    name: Schema drift gate
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # R516 — the resident schema-drift gate. It answers one question
      # mechanically: does every column the DDL declares have a paired ALTER
      # arm, so that it can reach a database created by an EARLIER version of
      # the product?
      #
      # `continue-on-error: true` is DELIBERATE and temporary: the gate is a
      # DEFECT-PRESENCE gate (R461 arm G / R512-14), so it is RED while the
      # defect exists. It reports; it does not block. Flip it to blocking in
      # the same commit that adds the two missing ALTER arms.
      #
      # The gate needs NO git history: the historical shape is frozen in the
      # checked-in `hub/scripts/r516_schema_baseline.json` artifact, because
      # CI checks out shallow and "which columns arrived after their table
      # existed" is a temporal fact that lives only in history.
      - name: Schema drift gate
        working-directory: hub
        run: python3 scripts/r516_schema_drift_gate.py

  integration:
    name: Root integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Check skill frontmatter
        run: npm run sync:skills:check

      - name: Build release packages
        run: npm run build:all

      - name: Run integration tests
        run: npm run test:integration
