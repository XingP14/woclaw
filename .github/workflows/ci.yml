name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hub:
    name: Hub (lint + build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json

      - name: Install dependencies
        working-directory: hub
        run: npm install

      - name: TypeScript check
        working-directory: hub
        run: npx tsc --noEmit

      - name: Build
        working-directory: hub
        run: npm run build

      - name: Test
        working-directory: hub
        run: npm test

  # plugin-lint disabled: persistent npm install failure in GitHub Actions ubuntu-latest
  # tracked in https://github.com/XingP14/woclaw/issues
  # Local verification: npx tsc --noEmit && npm run build work correctly
